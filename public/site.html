<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Hub</title>
<style>
  :root { color-scheme: dark; --bg: #0b0e17; --card: #141a2a; --line: rgba(255,255,255,.08); --text: #e6e9f2; --muted: #9098ad; --accent: #7aa2ff; --ok: #3ddc97; --warn: #f6b84b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(900px 500px at 80% -10%, #1d2a55 0%, var(--bg) 60%); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #5b7cff, #a06bff); display: grid; place-items: center; font-weight: 800; color: #fff; box-shadow: 0 10px 24px rgba(91,124,255,.35); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .desc { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(61,220,151,.15); }
  .status.maint .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(246,184,75,.15); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat .v { font-size: 28px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-bottom: 18px; }
  h2 { margin: 0 0 14px; font-size: 16px; color: #c8cfe0; }
  .ann { padding: 14px 0; border-top: 1px solid var(--line); }
  .ann:first-of-type { border-top: 0; padding-top: 0; }
  .ann h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .pin { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(122,162,255,.15); color: var(--accent); }
  .ann p { margin: 0; color: var(--muted); white-space: pre-wrap; line-height: 1.65; font-size: 14px; }
  .ann time { display: block; color: #6b7390; font-size: 12px; margin-top: 8px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .game { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,.02); }
  .game b { display: block; font-size: 15px; }
  .game span { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { color: #5f6782; font-size: 12px; text-align: center; margin-top: 30px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="logo">S</div>
      <div><h1 id="siteName">Server Hub</h1><p class="desc" id="desc"></p></div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">정상 운영 중</span></div>
  </header>
  <div class="grid">
    <div class="stat"><div class="k">접속 중 플레이어</div><div class="v" id="online">–</div></div>
    <div class="stat"><div class="k">등록된 게임</div><div class="v" id="gameCount">–</div></div>
    <div class="stat"><div class="k">서버 시간</div><div class="v" id="clock" style="font-size:22px">–</div></div>
  </div>
  <section><h2>공지사항</h2><div id="announcements" class="empty">등록된 공지가 없습니다.</div></section>
  <section><h2>게임 서버</h2><div id="games" class="empty">등록된 게임이 없습니다.</div></section>
  <footer>Powered by Server Hub · <a href="/admin">관리자 페이지</a></footer>
</div>
<script>
(function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(ts) { return new Date(ts).toLocaleString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  var serverOffset = 0;
  function load() {
    fetch('/api/public/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      serverOffset = s.time - Date.now();
      document.title = s.siteName;
      document.getElementById('siteName').textContent = s.siteName;
      document.getElementById('logo').textContent = (s.siteName || 'S').trim().charAt(0).toUpperCase();
      document.getElementById('desc').textContent = s.description || '';
      var st = document.getElementById('status');
      st.className = 'status' + (s.maintenance.enabled ? ' maint' : '');
      document.getElementById('statusText').textContent = s.maintenance.enabled ? '점검 중' : '정상 운영 중';
      document.getElementById('online').textContent = s.online.toLocaleString();
      document.getElementById('gameCount').textContent = s.games.length;
      var a = document.getElementById('announcements');
      if (s.announcements.length) a.className = '', a.innerHTML = s.announcements.map(function (x) { return '<div class="ann"><h3>' + esc(x.title) + (x.pinned ? '<span class="pin">고정</span>' : '') + '</h3><p>' + esc(x.body) + '</p><time>' + fmt(x.created) + '</time></div>'; }).join('');
      var g = document.getElementById('games');
      if (s.games.length) g.className = 'games', g.innerHTML = s.games.map(function (x) { return '<div class="game"><b>' + esc(x.name) + '</b><span>' + x.online + '명 접속 · 서버 ' + x.servers + '개 · v' + esc(x.version) + '</span></div>'; }).join('');
    }).catch(function () {});
  }
  function clock() { document.getElementById('clock').textContent = new Date(Date.now() + serverOffset).toLocaleTimeString('ko-KR'); }
  load(); setInterval(load, 15000); setInterval(clock, 1000); clock();
})();
</script>
</body>
</html>
